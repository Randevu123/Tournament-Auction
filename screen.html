<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내전 경매 · 방송 화면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  /* 방송 화면: 1920×1080 한 장을 창 크기에 맞춰 늘리고 줄임 (버튼 없음, 스크롤 없음) */
  html, body { width: 100%; height: 100%; overflow: hidden; cursor: none; }
  body { background: #05060a; }
  #fit { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; }
  .scr {
    position: absolute; inset: 0; overflow: hidden;
    background:
      radial-gradient(1100px 600px at 20% -10%, rgba(255,70,85,.28), transparent 60%),
      radial-gradient(1000px 600px at 110% 120%, rgba(80,120,255,.22), transparent 60%),
      linear-gradient(180deg, #0c0f19, #07080d);
  }
  .scr::before {     /* 은은하게 흐르는 사선 무늬 */
    content: ""; position: absolute; inset: -50%;
    background: repeating-linear-gradient(115deg, rgba(255,255,255,.025) 0 2px, transparent 2px 60px);
    animation: drift 30s linear infinite; pointer-events: none;
  }
  @keyframes drift { to { transform: translateX(120px); } }

  .hdr { position: absolute; left: 48px; right: 48px; top: 30px; height: 70px; display: flex; align-items: center; gap: 22px; }
  .hdr .logo { font-family: var(--num); font-size: 40px; letter-spacing: 1px; white-space: nowrap; }
  .hdr .logo span { color: var(--accent); }
  .hdr .title { font-size: 26px; font-weight: 900; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hdr .sp { flex: 1; }
  .hdr .chip { font-family: var(--num); font-size: 26px; padding: 8px 20px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid var(--line); white-space: nowrap; }
  .hdr .chip b { color: var(--gold); font-weight: 400; }
  .hdr .live { color: #fff; background: var(--accent); border-color: var(--accent); }
  .hdr .live::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #fff; margin-right: 10px; vertical-align: 3px; animation: blink 1s infinite; }

  /* 가운데: 지금 경매 중인 선수 + 입찰가 + 남은 시간 + 다음 순서 */
  .lot { position: absolute; left: 48px; right: 48px; top: 124px; height: 520px; display: grid; grid-template-columns: 820px 1fr 300px; gap: 28px; }
  .card { position: relative; border-radius: 26px; background: linear-gradient(160deg, rgba(30,36,56,.92), rgba(14,17,27,.92)); border: 1px solid var(--line); overflow: hidden; }
  .pcard { display: grid; grid-template-columns: 260px 1fr; gap: 30px; padding: 40px; align-items: center; }
  .pcard .lbl { position: absolute; top: 0; left: 40px; background: var(--accent); color: #fff; font-weight: 900; font-size: 18px; letter-spacing: 4px; padding: 6px 18px; border-radius: 0 0 12px 12px; }
  .pcard .ph .av { border-radius: 24px; border: 4px solid rgba(255,255,255,.12); box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .pcard.enter .ph, .pcard.enter .info { animation: enter .6s cubic-bezier(.2,1.3,.4,1) both; }
  .pcard.enter .info { animation-delay: .08s; }
  @keyframes enter { 0% { opacity: 0; transform: translateX(-60px); } 100% { opacity: 1; transform: none; } }
  .pname { font-family: var(--num); font-size: 84px; line-height: 1.05; word-break: break-all; text-shadow: 0 0 30px rgba(255,70,85,.35); }
  .ppos { display: inline-block; margin-top: 10px; font-size: 26px; font-weight: 900; padding: 4px 16px; border-radius: 999px; background: rgba(255,255,255,.08); }
  .pmotto { margin-top: 18px; font-size: 28px; color: #d9def0; font-style: italic; min-height: 38px; }
  .ptiers { margin-top: 22px; display: grid; grid-template-columns: 1.25fr 1.25fr 1fr; gap: 10px; }
  .ptiers div { background: rgba(255,255,255,.05); border-radius: 14px; padding: 12px 14px; }
  .ptiers small { display: block; font-size: 17px; color: var(--muted); }
  .ptiers b { font-family: var(--num); font-weight: 400; font-size: 30px; white-space: nowrap; }
  .ptiers .sc b { color: var(--gold); font-size: 42px; }
  .punsold { margin-top: 14px; color: var(--warn); font-size: 22px; font-weight: 900; min-height: 30px; }

  .bidc { display: grid; overflow: hidden; grid-template-rows: 1fr auto; padding: 34px 36px 30px; --c: #8a93ab; transition: border-color .3s, box-shadow .3s; }
  .bidc.has { border-color: var(--c); box-shadow: 0 0 0 2px var(--c), 0 0 70px color-mix(in srgb, var(--c) 45%, transparent); }
  .bidc small { font-size: 22px; color: var(--muted); letter-spacing: 2px; }
  .bamt { font-family: var(--num); font-size: 170px; line-height: 1; transform-origin: left center; white-space: nowrap; color: #fff; text-shadow: 0 0 50px var(--c); }
  .bamt i { font-style: normal; font-size: 70px; color: var(--muted); margin-left: 8px; }
  .bamt.bump { animation: bigbump .45s cubic-bezier(.2,1.8,.4,1); }
  @keyframes bigbump { 0% { transform: scale(1.22); color: var(--c); } 100% { transform: scale(1); } }
  .blead { font-family: var(--num); font-size: 46px; color: var(--c); min-height: 56px; }
  .tmr { display: flex; align-items: flex-end; gap: 18px; }
  .tnum { font-family: var(--num); font-size: 110px; line-height: .9; min-width: 250px; }
  .tnum.low { color: var(--accent); animation: blink .5s infinite; }
  .tplus { font-family: var(--num); font-size: 54px; color: var(--ok); opacity: 0; }
  .tplus.show { animation: plus 1.1s ease forwards; }
  .tbar { height: 16px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; margin-top: 16px; }
  .tbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--gold)); }
  .tstate { margin-top: 12px; font-size: 24px; color: var(--muted); font-weight: 700; min-height: 32px; }

  .next { padding: 26px 22px; }
  .next h3 { margin: 0 0 14px; font-size: 20px; letter-spacing: 4px; color: var(--accent); }
  .next ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .next li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,.04); font-size: 20px; font-weight: 700; min-width: 0; }
  .next li .n { font-family: var(--num); font-weight: 400; color: var(--muted); width: 26px; }
  .next li .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .next li .s { color: var(--gold); font-family: var(--num); font-weight: 400; }
  .next .more { margin-top: 12px; color: var(--muted); font-size: 20px; }

  /* 아래: 팀 카드 */
  .tgrid { position: absolute; left: 48px; right: 48px; bottom: 36px; height: 380px; display: grid; gap: 16px; grid-auto-flow: column; grid-auto-columns: 1fr; }
  .tm { position: relative; border-radius: 20px; background: rgba(18,22,34,.94); border: 1px solid var(--line); border-top: 6px solid var(--c); padding: 16px 16px 12px; display: grid; grid-template-rows: auto auto 1fr auto; gap: 8px; overflow: hidden; transition: box-shadow .3s, transform .3s; }
  .tm.lead { box-shadow: 0 0 0 3px var(--c), 0 0 50px color-mix(in srgb, var(--c) 55%, transparent); transform: translateY(-8px); }
  .tm.lead::after { content: "최고가"; position: absolute; top: 10px; right: 12px; background: var(--c); color: #0b0d14; font-weight: 900; font-size: 16px; padding: 2px 10px; border-radius: 999px; }
  .tm.pulse { animation: tpulse .8s ease; }
  .tm .nm { font-family: var(--num); font-size: 30px; color: var(--c); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 70px; }
  .tm .pts { font-family: var(--num); font-size: 48px; line-height: 1; }
  .tm .pts small { font-size: 22px; color: var(--muted); margin-left: 4px; }
  .tm .pts.changed { animation: pchg 1s ease; }
  .tm ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; align-content: start; }
  .tm li { display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 700; min-height: 34px; }
  .tm li .w { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tm li .pr { font-family: var(--num); font-weight: 400; color: var(--gold); }
  .tm li .pr.cap { color: var(--c); font-family: inherit; font-weight: 900; font-size: 15px; }
  .tm li .pr.rnd { color: var(--warn); font-family: inherit; font-weight: 900; font-size: 15px; }
  .tm li.empty { color: #4b536b; border: 1px dashed #2f364a; border-radius: 8px; justify-content: center; font-size: 15px; }
  .tm li.fresh { animation: slidein .5s ease; }
  .tm .ft { display: flex; justify-content: space-between; font-size: 17px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }
  .tm .ft b { color: var(--gold); font-family: var(--num); font-weight: 400; font-size: 22px; }

  /* 준비 중 · 일시정지 · 끝 */
  .stand { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .stand .big { font-family: var(--num); font-size: 150px; line-height: 1.1; text-shadow: 0 0 60px rgba(255,70,85,.5); }
  .stand .big span { color: var(--accent); }
  .stand .sub { font-size: 40px; font-weight: 900; color: var(--muted); margin-top: 18px; }
  .stand .caps { margin-top: 50px; display: flex; gap: 22px; justify-content: center; }
  .stand .caps div { display: grid; justify-items: center; gap: 10px; font-size: 26px; font-weight: 900; color: var(--c); animation: pop .5s ease both; }
  .stand .caps .av { border: 3px solid var(--c); box-shadow: 0 0 26px color-mix(in srgb, var(--c) 60%, transparent); }
  .pause { position: absolute; left: 50%; top: 360px; transform: translateX(-50%); z-index: 5; font-family: var(--num); font-size: 90px; padding: 10px 60px; border-radius: 22px; background: rgba(5,6,10,.85); border: 2px solid var(--warn); color: var(--warn); animation: blink 1.4s infinite; }
  .done { position: absolute; left: 48px; right: 48px; top: 120px; bottom: 36px; display: grid; align-content: start; gap: 18px; }
  .done .result-head h2 { font-size: 80px; }
  .done .result-grid { grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 16px; }
  .done .result-team { min-width: 0; }
  .done .rt-table { table-layout: fixed; }
  .done .rt-table td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .done .rt-table td:first-child { width: 32px; } .done .rt-table td.sc { width: 58px; } .done .rt-table td.pr { width: 78px; }
  .done .rt-table td:nth-child(3) { width: 80px; }
  .done.many .rt-head { flex-wrap: wrap; row-gap: 4px; }
  .done.many .rt-head b { font-size: 26px; flex-basis: 100%; }
  .done.many .rt-rank { margin-left: 0; }
  .done.many .rt-nums { grid-template-columns: 1fr 1fr; }
  .done.many .rt-table { font-size: 17px; }
  .done .result-team { padding: 16px; }
  .done .rt-head b { font-size: 30px; }
  .done .rt-nums b { font-size: 22px; }
  .done .rt-nums small { font-size: 13px; }
  .done .rt-table { font-size: 18px; }
  .done .rt-crown { font-size: 16px; }
  .done .result-left { font-size: 20px; }
  .done.many .rt-table td:nth-child(3) { display: none; }

  .pagents { margin-top: 14px; min-height: 0; }
  .pagents .agents { gap: 8px; }
  .pagents .ag { font-size: 24px; padding: 4px 18px 4px 4px; gap: 10px; }
  .pagents .ag:first-child { background: rgba(255,209,102,.28); }

  /* 순서 추첨 (진행자 화면에서 추첨하면 같은 연출이 여기에도 나옴) */
  .drawov { position: absolute; inset: 0; z-index: 30; background: radial-gradient(1100px 600px at 50% -10%, rgba(255,70,85,.22), transparent 60%), #06070c; padding: 40px 48px; display: grid; grid-template-rows: auto 1fr; gap: 26px; }
  .drawov .dh { text-align: center; font-family: var(--num); font-size: 76px; }
  .drawov .dh span { color: var(--accent); }
  .dwrap { display: grid; grid-template-columns: 640px 1fr; gap: 40px; min-height: 0; }
  .roul { align-self: start; display: grid; justify-items: center; gap: 18px; padding: 40px; border-radius: 28px; background: linear-gradient(160deg, #1a1f30, #10131d); border: 1px solid var(--line); }
  .roul .no { font-family: var(--num); font-size: 48px; color: var(--accent); }
  .roul .nm { font-family: var(--num); font-size: 72px; text-align: center; word-break: break-all; line-height: 1.1; }
  .roul .sub { color: var(--muted); font-size: 28px; min-height: 40px; text-align: center; }
  .roul.locked .nm { color: var(--gold); text-shadow: 0 0 34px rgba(255,209,102,.55); animation: bump .35s ease; }
  .roul .av { border-radius: 24px; }
  .dlist { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 58px; gap: 10px; align-content: start; overflow: hidden; }
  .dlist li { display: flex; align-items: center; gap: 12px; padding: 0 14px; border-radius: 12px; background: rgba(255,255,255,.05); border: 1px solid var(--line); font-size: 24px; font-weight: 700; animation: slidein .35s ease; min-width: 0; }
  .dlist li b { font-family: var(--num); font-weight: 400; color: var(--accent); width: 40px; font-size: 28px; flex: none; }
  .dlist li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dlist.many { grid-template-columns: repeat(4, 1fr); grid-auto-rows: 50px; }
  .dlist.many li { font-size: 20px; }

  .grade.xl { min-width: 64px; height: 64px; font-size: 44px; border-radius: 14px; margin-right: 16px; vertical-align: 14px; }
  .dlist .grade, .next .grade, .tm .grade { flex: none; }
  .offline { position: absolute; right: 18px; bottom: 10px; font-size: 14px; color: #555c70; }
  .flash-title { font-size: 220px; }
  .flash-sub { font-size: 60px; }
  .msg { position: absolute; inset: 0; display: grid; place-items: center; font-size: 36px; color: var(--muted); text-align: center; padding: 80px; }
</style>
</head>
<body>
<div id="fit">
  <div class="scr" id="scr">
    <div class="msg" id="msg">연결 중…</div>
    <div id="live" hidden>
      <div class="hdr">
        <div class="logo">VALORANT <span>내전 경매</span></div>
        <div class="title" id="title"></div>
        <div class="sp"></div>
        <div class="chip" id="chipLive" hidden></div>
        <div class="chip" id="chipSeats"></div>
      </div>

      <div id="standby" class="stand" hidden>
        <div>
          <div class="big">선수 경매 <span>곧 시작</span></div>
          <div class="sub" id="standSub"></div>
          <div class="caps" id="standCaps"></div>
        </div>
      </div>

      <div class="lot" id="lot" hidden>
        <div class="card pcard" id="pcard">
          <div class="lbl">NOW ON AUCTION</div>
          <div class="ph" id="pPhoto"></div>
          <div class="info">
            <div class="pname"><span id="pGrade"></span><span id="pName"></span></div>
            <span class="ppos" id="pPos"></span>
            <div class="pagents" id="pAgents"></div>
            <div class="pmotto" id="pMotto"></div>
            <div class="ptiers">
              <div><small>최고 티어</small><b id="pPeak"></b></div>
              <div><small>현재 티어</small><b id="pCur"></b></div>
              <div class="sc"><small>티어 점수</small><b id="pScore"></b></div>
            </div>
            <div class="punsold" id="pUnsold"></div>
          </div>
        </div>
        <div class="card bidc" id="bidc">
          <div>
            <small>현재 최고가</small>
            <div class="bamt" id="bAmt">0<i>P</i></div>
            <div class="blead" id="bLead"></div>
          </div>
          <div>
            <small>남은 시간</small>
            <div class="tmr"><span class="tnum" id="tNum">-</span><span class="tplus" id="tPlus">+5</span></div>
            <div class="tbar"><i id="tBar"></i></div>
            <div class="tstate" id="tState"></div>
          </div>
        </div>
        <div class="card next">
          <h3>NEXT</h3>
          <ol id="nextList"></ol>
          <div class="more" id="nextMore"></div>
        </div>
      </div>
      <div class="pause" id="pause" hidden>일시정지</div>

      <div class="tgrid" id="teams" hidden></div>

      <div class="done" id="done" hidden>
        <div class="result-head"><h2>경매 <span>결과</span></h2></div>
        <div id="resultBody"></div>
      </div>
    </div>
    <div class="drawov" id="drawOv" hidden>
      <div class="dh">경매 순서 <span>추첨</span></div>
      <div class="dwrap">
        <div class="roul" id="roul"><div class="no" id="dNo"></div><div id="dPhoto"></div><div class="nm" id="dName"></div><div class="sub" id="dSub"></div></div>
        <ol class="dlist" id="dList"></ol>
      </div>
    </div>
    <div class="riot-notice" id="riotNotice" style="position:absolute;left:48px;bottom:8px;text-align:left;font-size:12px;color:#3f4658"></div>
    <div class="offline" id="offline" hidden>다시 연결 중</div>
    <div class="flash" id="flash"><div class="flash-inner"><div id="flashPhoto"></div><div class="flash-title" id="flashTitle"></div><div class="flash-sub" id="flashSub"></div></div></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
/* =====================================================================
   방송 화면 (OBS 브라우저 소스용)
   - 버튼이 하나도 없고, 보기만 합니다. 방송 화면 전용 링크로만 열려요.
   - 채팅은 보이지 않아요 (채팅은 진행자와 팀장끼리만).
   - 키보드 R: 결과 발표 연출 다시 보기 (OBS에서 "상호작용"으로 누를 수 있음)
   ===================================================================== */
const $ = id => document.getElementById(id);
let net = null, S = null, lastSeq = null, prevCur = null, resultSig = "", revealed = false, sawRunning = false;

// 1920×1080 화면을 창 크기에 맞춤
function fit() {
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  $("fit").style.transform = `scale(${k}) translate(-50%, -50%)`;
}
addEventListener("resize", fit); fit();
$("riotNotice").textContent = RIOT_NOTICE;

async function boot() {
  const { id, key } = linkParams();
  if (!isConfigured()) return ($("msg").textContent = "config.js에 Supabase 연결 정보가 없어요.");
  if (!id || !key) return ($("msg").textContent = "방송 화면 링크가 필요해요. 운영자 콘솔의 ‘링크’ 탭이나 진행자 화면의 ‘링크’에서 복사해 주세요.");
  const sb = window.supabase.createClient(AUCTION_CONFIG.supabaseUrl, AUCTION_CONFIG.supabaseKey, { auth: { persistSession: false } });
  const { data: who, error } = await sb.rpc("whoami", { p_id: id, p_key: key });
  if (error) { $("msg").textContent = "서버에 연결하지 못했어요. 잠시 뒤 새로고침돼요."; return setTimeout(() => location.reload(), 10000); }
  if (!who || who.role !== "screen") return ($("msg").textContent = "방송 화면 링크가 올바르지 않아요. 링크를 다시 복사해 주세요.");
  net = connect({ id, key, presenceKey: "screen", presenceInfo: { role: "screen" }, chat: false, onState, onChat: () => {}, onConn: setConn,
    onEvent: { show: onShow } });
}

let offTimer = null;
function setConn(status) {
  clearTimeout(offTimer);
  if (status === "SUBSCRIBED") $("offline").hidden = true;
  else offTimer = setTimeout(() => ($("offline").hidden = false), 8000);   // 잠깐 끊긴 건 방송에 안 보이게
}

function onState(s) {
  const prev = S;
  S = s;
  setScoreConfig(s.config);
  soundForState(prev, s);
  $("msg").hidden = true; $("live").hidden = false;
  if (lastSeq === null) lastSeq = s.last_result ? s.last_result.seq : 0;
  else if (s.last_result && s.last_result.seq > lastSeq) { lastSeq = s.last_result.seq; flashResult(s); }
  if (prev && s.status === "running" && prev.status === "running" && s.current === prev.current && s.bid_amount !== prev.bid_amount) {
    bumpEl($("bAmt"), "bump");
    $("tPlus").textContent = `+${Math.max(0, (s.ends_at - prev.ends_at) / 1000).toFixed(1)}`;
    bumpEl($("tPlus"), "show");
    if (s.bid_team !== null) bumpEl(document.querySelector(`.tm[data-id="${s.bid_team}"]`), "pulse");
  }
  render(prev);
  // 추첨한 순서가 저장되면(경매 준비 → 시작 대기) 추첨 화면을 잠시 보여 준 뒤 닫음
  if (drawing && s.status !== "setup" && !drawCloseTimer) drawCloseTimer = setTimeout(closeDraw, drawIdx < drawOrder.length ? 600 : 3000);
}

/* ---------- 순서 추첨: 진행자 화면이 보낸 순서로 같은 룰렛 연출 ---------- */
let drawing = false, drawOrder = [], drawIdx = 0, drawTimer = null, drawCloseTimer = null;
function onShow(m) {
  if (!S) return;
  if (m.kind === "draw" && Array.isArray(m.order) && S.status === "setup") startDraw(m.order);   // 추첨은 경매 준비 중에만
  else if (m.kind === "draw-skip" && drawing) skipDraw();
  else if (m.kind === "draw-close") closeDraw();
}
function startDraw(ids) {
  clearTimeout(drawTimer); clearTimeout(drawCloseTimer); drawCloseTimer = null;
  drawOrder = ids.map(id => S.players.find(p => p.id === id)).filter(Boolean);
  if (!drawOrder.length) return;
  drawing = true; drawIdx = 0;
  $("dList").innerHTML = "";
  $("dList").classList.toggle("many", drawOrder.length > 36);
  $("drawOv").hidden = false;
  stepDraw();
}
function showRoul(p, locked, no) {
  $("roul").classList.toggle("locked", locked);
  $("dNo").textContent = `${no}번`;
  $("dPhoto").innerHTML = avatar(p, 220);
  $("dName").textContent = p.name;
  $("dSub").innerHTML = locked ? `${gradeBadge(p)}${esc(p.pos)} · ${esc(p.peak)} / ${esc(p.current)} ${agentChips(p, "lg", 30)}` : "";
}
function addDrawn(i, p) {
  const li = document.createElement("li");
  li.innerHTML = `<b>${i + 1}</b>${avatar(p, 36)}<span>${gradeBadge(p, "sm")}${esc(p.name)}</span>`;
  $("dList").appendChild(li);
}
function stepDraw() {                   // 진행자 화면과 같은 박자 (한 명당 약 1초)
  if (drawIdx >= drawOrder.length) return finishDraw();
  const rest = drawOrder.slice(drawIdx);
  let spins = 0; const total = rest.length > 1 ? 7 : 0;
  const spin = () => {
    if (spins < total) { showRoul(rest[Math.floor(Math.random() * rest.length)], false, drawIdx + 1); SFX.spin(); spins++; drawTimer = setTimeout(spin, 35 + spins * 12); }
    else { showRoul(drawOrder[drawIdx], true, drawIdx + 1); SFX.lock(); addDrawn(drawIdx, drawOrder[drawIdx]); drawIdx++; drawTimer = setTimeout(stepDraw, 380); }
  };
  spin();
}
function skipDraw() {
  clearTimeout(drawTimer);
  while (drawIdx < drawOrder.length) { addDrawn(drawIdx, drawOrder[drawIdx]); drawIdx++; }
  finishDraw();
}
function finishDraw() { clearTimeout(drawTimer); $("dNo").textContent = "추첨 완료"; }
function closeDraw() {
  clearTimeout(drawTimer); clearTimeout(drawCloseTimer); drawCloseTimer = null;
  drawing = false; $("drawOv").hidden = true;
}

function render(prev) {
  const s = S, c = s.config;
  const setup = s.status === "setup", done = s.status === "done";
  $("title").textContent = s.title || "";
  const filled = s.players.filter(x => x.team !== null).length;
  $("chipSeats").innerHTML = `자리 <b>${filled}</b> / ${s.teams.length * c.teamSize}`;
  const live = ["running", "paused", "result", "ready"].includes(s.status);
  $("chipLive").hidden = !live;
  $("chipLive").className = "chip" + (s.status === "running" ? " live" : "");
  $("chipLive").textContent = s.status === "running" ? "LIVE" : s.status === "paused" ? "일시정지" : s.status === "ready" ? "준비" : "발표";

  // 준비 중: 대기 화면
  $("standby").hidden = !setup;
  if (setup) {
    $("standSub").textContent = s.players.length ? `팀장 ${s.teams.length}명 · 경매 선수 ${s.queue.length}명` : "";
    const caps = s.players.filter(p => p.how === "captain" && p.team !== null).sort((a, b) => a.team - b.team);
    $("standCaps").innerHTML = caps.map(p => `<div style="--c:${esc(s.teams[p.team].color)}">${avatar(p, 120)}<span>${esc(p.name)}</span></div>`).join("");
  }

  // 끝: 결과 발표
  $("done").hidden = !done;
  if (done) {
    const sig = JSON.stringify(s.teams) + s.players.map(x => `${x.id}:${x.team}:${x.score}:${x.peak}:${x.current}:${x.photo ? 1 : 0}`).join();
    if (sig !== resultSig) {
      resultSig = sig;
      const willReveal = sawRunning && !revealed;
      $("done").style.setProperty("--n", Math.max(1, s.teams.length));
      $("done").classList.toggle("many", s.teams.length > 5);
      $("resultBody").innerHTML = resultHtml(s, { reveal: willReveal, discord: false });
      if (willReveal) { revealed = true; setTimeout(() => playResultReveal($("resultBody"), { gap: 1500 }), (c.resultShowMs || 2200) + 300); }
    }
  } else { resultSig = ""; if (!setup) sawRunning = true; }

  // 경매 중
  const showLot = !setup && !done;
  $("lot").hidden = !showLot; $("teams").hidden = setup || done;
  $("pause").hidden = s.status !== "paused";
  if (showLot) renderLot(s);
  if (!setup && !done) renderTeams(s, prev);
}

function renderLot(s) {
  const p = s.players.find(x => x.id === s.current) || null;
  if (s.current !== prevCur) {
    prevCur = s.current;
    $("pPhoto").innerHTML = p ? avatar(p, 260) : "";
    bumpEl($("pcard"), "enter");
  } else if (p && !$("pPhoto").querySelector("img") && p.photo) $("pPhoto").innerHTML = avatar(p, 260);
  $("pName").textContent = p ? p.name : "-";
  $("pGrade").innerHTML = p ? gradeBadge(p, "xl") : "";
  $("pPos").textContent = p ? p.pos : "-";
  $("pAgents").innerHTML = p ? agentChips(p, "", 44) : "";
  $("pMotto").textContent = p && p.motto ? `“${p.motto}”` : "";
  $("pPeak").textContent = p ? p.peak : "-";
  $("pCur").textContent = p ? p.current : "-";
  $("pScore").textContent = p ? playerScore(p).toFixed(1) : "-";
  $("pUnsold").textContent = p && p.unsold ? `유찰 ${p.unsold}회 — 한 번 더 유찰되면 무작위 배정` : "";

  const t = s.bid_team !== null ? s.teams[s.bid_team] : null;
  $("bAmt").innerHTML = `${s.bid_amount}<i>P</i>`;
  $("bLead").textContent = t ? t.name : "아직 입찰 없음";
  $("bidc").classList.toggle("has", !!t);
  $("bidc").style.setProperty("--c", t ? t.color : "#8a93ab");
  const c = s.config;
  $("tState").textContent = { ready: "잠시 후 시작합니다", running: `입찰마다 +${c.bidAddSeconds}초 · 최대 ${c.maxSeconds}초`, paused: "일시정지", result: "결과 발표" }[s.status] || "";

  const queue = s.queue.map(id => s.players.find(x => x.id === id)).filter(Boolean).filter(q => q.id !== s.current);
  $("nextList").innerHTML = queue.length
    ? queue.slice(0, 6).map((q, i) => `<li><span class="n">${i + 1}</span>${avatar(q, 34)}<span class="nm">${gradeBadge(q, "sm")}${esc(q.name)}</span><span class="s">${playerScore(q).toFixed(1)}</span></li>`).join("")
    : `<li><span class="nm" style="color:var(--muted)">마지막 선수</span></li>`;
  $("nextMore").textContent = queue.length > 6 ? `외 ${queue.length - 6}명` : "";
}

let teamSig = "";
function renderTeams(s, prev) {
  const c = s.config, wrap = $("teams");
  const sig = s.teams.map(t => t.idx + t.name + t.color).join("|") + s.players_version;
  if (sig !== teamSig) {
    teamSig = sig;
    wrap.innerHTML = s.teams.map(t => `<div class="tm" data-id="${t.idx}" style="--c:${esc(t.color)}">
      <div class="nm">${esc(t.name)}</div><div class="pts" data-k="pts"></div><ul data-k="roster"></ul>
      <div class="ft"><span>점수 합계 <b data-k="sum"></b></span><span>평균 <b data-k="avg"></b></span></div></div>`).join("");
  }
  for (const t of s.teams) {
    const el = wrap.querySelector(`.tm[data-id="${t.idx}"]`); if (!el) continue;
    const roster = rosterOf(s, t.idx), { sum, avg } = teamScore(roster);
    const pts = el.querySelector('[data-k="pts"]');
    pts.innerHTML = `${t.points}<small>P</small>`;
    const old = prev && prev.teams[t.idx] ? prev.teams[t.idx].points : t.points;
    if (old !== t.points) bumpEl(pts, "changed");
    const had = new Set(prev ? rosterOf(prev, t.idx).map(r => r.id) : roster.map(r => r.id));
    const rows = roster.map(r => `<li class="${had.has(r.id) ? "" : "fresh"}">${avatar(r, 30)}<span class="w">${gradeBadge(r, "sm")}${esc(r.name)}</span>${
      priceTag(r)}</li>`);
    const miss = missingGrades(s, t.idx);
    while (rows.length < c.teamSize) rows.push(`<li class="empty">${miss.length ? `${miss.shift()}티어 빈자리` : "빈자리"}</li>`);
    el.querySelector('[data-k="roster"]').innerHTML = rows.join("");
    el.querySelector('[data-k="sum"]').textContent = sum.toFixed(1);
    el.querySelector('[data-k="avg"]').textContent = avg === null ? "-" : avg.toFixed(1);
    el.classList.toggle("lead", s.bid_team === t.idx && s.status === "running");
  }
}

const tickSound = countdownTicker();
// 소리: 기본으로 켬 (OBS에서 소스 소리로 잡힘). 주소 끝에 &sound=0 이면 끔
if (new URLSearchParams(location.search).get("sound") === "0") SFX.set(false); else SFX.set(true);
function renderTimer() {
  if (S && net) {
    const left = timeLeftMs(S, net.serverNow());
    tickSound(S, left);
    $("tNum").textContent = ["done", "result", "setup"].includes(S.status) ? "-" : (left / 1000).toFixed(1);
    $("tNum").classList.toggle("low", S.status === "running" && left < 5000);
    $("tBar").style.width = `${Math.min(100, left / (S.config.maxSeconds * 1000) * 100)}%`;
  }
  requestAnimationFrame(renderTimer);
}
requestAnimationFrame(renderTimer);

document.addEventListener("keydown", e => {
  if ((e.key === "r" || e.key === "R") && S && S.status === "done") playResultReveal($("resultBody"), { gap: 1500 });
});

boot();
</script>
</body>
</html>
