<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내전 운영자 콘솔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css?v=dev">
<style>
  :root { --discord: #5865f2; }
  header .me { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  header .me img, header .me .av { width: 30px; height: 30px; border-radius: 50%; }
  #svc { background: none; cursor: pointer; font: inherit; font-size: 12px; }
  .svc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .svc-grid div { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; }
  .svc-grid small { display: block; font-size: 11px; color: var(--muted); }
  .svc-grid b { font-family: var(--num); font-weight: 400; font-size: 22px; }
  .role { font-size: 11px; font-weight: 900; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .role.owner { color: var(--gold); border-color: var(--gold); }
  .role.staff { color: var(--ok); border-color: var(--ok); }
  .link-btn { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 13px; padding: 4px; }

  .gate { max-width: 520px; margin: 60px auto; padding: 0 16px; }
  .gate .panel { padding: 26px; display: grid; gap: 14px; text-align: center; }
  .gate h2 { font-family: var(--num); font-weight: 400; font-size: 34px; margin: 0; }
  .gate p { color: var(--muted); margin: 0; line-height: 1.6; }
  .btn-discord { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; background: var(--discord); color: #fff; border: 0; border-radius: 12px; padding: 15px; font-size: 17px; font-weight: 900; }

  .console { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; padding: 16px 20px 40px; align-items: start; }
  aside { display: grid; gap: 10px; position: sticky; top: 12px; }
  .ev-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-height: calc(100vh - 220px); overflow: auto; }
  .ev-list li { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; display: grid; gap: 4px; }
  .ev-list li.past { opacity: .72; }
  .ev-list li.past.on { opacity: 1; }
  .ev-list .past-head { cursor: pointer; display: flex; align-items: center; gap: 8px; background: none; border: 1px dashed var(--line); color: var(--muted); font-size: 13px; font-weight: 700; padding: 8px 12px; margin-top: 6px; }
  .ev-list .past-head b { color: var(--text); }
  .ev-list .past-head span { margin-left: auto; font-size: 12px; }
  .ev-list li.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 20px rgba(255,70,85,.2); }
  .ev-list .t { font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev-list .m { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { display: inline-block; font-size: 11px; font-weight: 900; padding: 1px 8px; border-radius: 999px; background: rgba(255,255,255,.06); color: var(--muted); }
  .chip.open { background: rgba(61,220,151,.15); color: var(--ok); }
  .chip.closed { background: rgba(255,176,32,.12); color: var(--warn); }
  .chip.done { background: rgba(61,220,151,.15); color: var(--ok); }
  .chip.part { background: rgba(255,209,102,.12); color: var(--gold); }

  .ev-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .ev-head h2 { margin: 0; font-family: var(--num); font-weight: 400; font-size: 32px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .stat small { display: block; font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  .stat b { font-family: var(--num); font-weight: 400; font-size: 28px; }
  .stat b em { font-style: normal; font-size: 16px; color: var(--muted); }
  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
  .tabs button { background: none; border: 0; color: var(--muted); padding: 10px 14px; font-weight: 900; border-bottom: 3px solid transparent; white-space: nowrap; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .tabs button b { font-size: 11px; background: var(--panel-2); padding: 0 6px; border-radius: 999px; margin-left: 4px; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .toolbar input, .toolbar select, .form-row input, .form-row select, .field input, .field select, .field textarea {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
  .table-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  table.grid { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 1080px; }
  table.grid th { text-align: left; font-size: 11px; color: var(--muted); padding: 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; letter-spacing: 1px; }
  table.grid td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.grid tr:last-child td { border-bottom: 0; }
  table.grid tr.captain td { background: rgba(255,209,102,.05); }
  .dc { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .dc img, .dc .av { width: 26px; height: 26px; border-radius: 50%; }
  .dc small { display: block; color: var(--muted); font-size: 11px; }
  .star { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; width: 34px; height: 30px; font-size: 16px; }
  .star.on { color: #1a1400; background: var(--gold); border-color: var(--gold); }
  .chk { display: grid; gap: 4px; min-width: 120px; }
  .chk .names { font-size: 11px; color: var(--muted); }
  .chk button { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 12px; font-weight: 700; }
  .chk button.mine { border-color: var(--ok); color: var(--ok); }
  .calc { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .memo { max-width: 180px; font-size: 12px; color: #d9c7ff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .memo.empty { color: var(--muted); }
  .acts { display: flex; gap: 4px; }
  .acts button { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 12px; }
  .acts button.del { color: #ff8c96; }
  .score { font-family: var(--num); font-size: 18px; color: var(--gold); }

  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .field { display: grid; gap: 6px; }
  .field label { font-size: 12px; font-weight: 700; color: var(--muted); }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; font-weight: 700; }
  .seg button.on { border-color: var(--accent); background: rgba(255,70,85,.15); color: #ff8c96; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; margin-bottom: 14px; }
  .card h3 { margin: 0; font-size: 13px; letter-spacing: 2px; color: var(--muted); }
  .big-state { font-family: var(--num); font-size: 26px; }

  .tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .tasks li { display: grid; grid-template-columns: 26px 1fr 160px 150px 34px; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .tasks li.done .tt { text-decoration: line-through; color: var(--muted); }
  .tasks li.late .due { color: var(--accent); font-weight: 900; }
  .tasks input[type=checkbox] { width: 18px; height: 18px; }
  .tasks select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px; font-size: 12px; }
  .tasks .due { font-size: 12px; color: var(--muted); }
  .tasks .x { background: none; border: 0; color: var(--muted); font-size: 18px; }
  .form-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .form-row input[type=text] { flex: 1; min-width: 180px; }

  .people { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .people li { display: flex; align-items: center; gap: 10px; background: var(--panel-2); border-radius: 10px; padding: 8px 10px; }
  .people li .grow { flex: 1; min-width: 0; }
  .people img, .people .av { width: 34px; height: 34px; border-radius: 50%; }

  #hostTo { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
  .host-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
  .host-chip b { color: var(--gold); }
  .prep-step h3 .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 12px; margin-right: 6px; letter-spacing: 0; }
  .prep-step.locked { opacity: .6; }
  .prep-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .prep-table th { text-align: left; font-size: 11px; color: var(--muted); padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .prep-table td { padding: 6px; border-bottom: 1px solid var(--line); }
  .prep-table tr.excluded td { opacity: .4; }
  .prep-table tr.cap td { background: rgba(255,209,102,.06); }
  .prep-table input[type=number] { width: 90px; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; }
  .prep-table .star { min-width: 64px; }
  .danger { border-color: rgba(255,70,85,.5); }
  .danger h3 { color: #ff8c96; }
  .log-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .log-list li { display: grid; grid-template-columns: 165px 110px 150px 1fr; gap: 12px; align-items: start; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
  .log-list .when { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .log-list .who { font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log-list .act { font-weight: 700; }
  .log-list .detail { color: #cfd5e6; word-break: break-word; }
  .log-list .ev { display: block; color: var(--muted); font-size: 11px; }
  .act.a-add { color: var(--ok); } .act.a-del { color: #ff8c96; } .act.a-edit { color: var(--gold); } .act.a-check { color: #8fd3ff; } .act.a-staff { color: #c9a6ff; }
  @media (max-width: 900px) { .log-list li { grid-template-columns: 1fr; gap: 2px; } }
  .modal { position: fixed; inset: 0; background: rgba(5,6,10,.85); z-index: 45; display: none; place-items: center; padding: 16px; }
  .modal.show { display: grid; }
  .modal .box { width: min(520px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 12px; }
  #editModal .box { width: min(640px, 100%); }
  #editModal .agent-pick button { padding: 5px 9px; font-size: 13px; }
  .modal h3 { margin: 0; font-family: var(--num); font-weight: 400; font-size: 26px; }
  .modal textarea { min-height: 70px; resize: vertical; }
  .modal .row { display: flex; gap: 8px; justify-content: flex-end; }
  .warn-note { font-size: 12px; color: var(--warn); }
  .empty-view { color: var(--muted); text-align: center; padding: 60px 10px; }

  @media (max-width: 900px) {
    .console { grid-template-columns: 1fr; padding: 12px 16px 40px; }
    aside { position: static; }
    .ev-list { max-height: 240px; }
    .tasks li { grid-template-columns: 26px 1fr 34px; }
    .tasks li select, .tasks li .due { grid-column: 2 / 3; }
  }
</style>
</head>
<body>
<header>
  <a class="home-btn" href="index.html" title="홈으로">홈</a>
  <div class="logo">VALORANT <span>운영자 콘솔</span></div>
  <div class="spacer"></div>
  <button class="conn" id="svc" hidden title="서비스 상태 보기">서버 확인 중…</button>
  <div class="me" id="me" hidden></div>
</header>

<div class="gate" id="gate" hidden><div class="panel" id="gateBox"></div></div>

<div class="console" id="console" hidden>
  <aside>
    <button class="btn primary" id="btnNewEvent">새 회차 만들기</button>
    <ul class="ev-list" id="evList"></ul>
    <button class="btn" id="btnStaff">운영자 관리</button>
  </aside>
  <main id="view"></main>
</div>

<!-- 신청 고치기 -->
<div class="modal" id="editModal"><div class="box">
  <h3>신청 고치기</h3>
  <div class="dc" id="editWho"></div>
  <div class="field"><label>게임 닉네임</label><input id="eNick" maxlength="16"></div>
  <div class="form-grid">
    <div class="field"><label>최고 티어</label><select id="ePeak"></select></div>
    <div class="field"><label>현재 티어</label><select id="eCur"></select></div>
    <div class="field"><label>포지션</label><select id="ePos"></select></div>
    <div class="field"><label>점수 직접 입력 (비우면 자동)</label><input id="eScore" type="number" step="0.1" min="0" max="1000" placeholder="자동"></div>
  </div>
  <div class="calc" id="eCalc"></div>
  <div class="field"><label>주 요원 (최대 3개, 누른 순서대로)</label><div id="eAgents"></div></div>
  <div class="field"><label>각오 한마디 (선수 카드에 나와요)</label><input id="eMotto" maxlength="60"></div>
  <div class="field"><label>운영자 메모 (참가자에게는 안 보여요)</label><textarea id="eMemo" maxlength="200"></textarea></div>
  <div class="warn-note">티어를 바꾸면 이 사람의 티어 검수와 점수 재확인이 처음부터 다시 시작돼요.</div>
  <div class="row"><button class="btn" data-close>닫기</button><button class="btn primary" id="btnEditSave">저장</button></div>
</div></div>

<!-- 새 회차 -->
<div class="modal" id="newModal"><div class="box">
  <h3>새 회차 만들기</h3>
  <div class="field"><label>회차 이름</label><input id="nTitle" maxlength="60" placeholder="예: 10월 1주차 내전"></div>
  <p style="color:var(--muted);margin:0;font-size:13px">만든 뒤 ‘일정’ 탭에서 신청 기간과 경매 날짜를 정하고 신청을 여세요. 처음에는 신청이 닫혀 있어요.</p>
  <div class="row"><button class="btn" data-close>닫기</button><button class="btn primary" id="btnNewSave">만들기</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js?v=dev"></script>
<script src="common.js?v=dev"></script>
<script>
/* =====================================================================
   운영자 콘솔 — 경매 전에 쓰는 화면
   참가자 명단 관리(고치기·지우기·메모·팀장 배정), 티어/점수 교차검수(운영자 2명),
   회차 일정·신청 마감, 할 일, 링크, 운영자 초대·승인
   ===================================================================== */
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const NEED_CHECKS = 2;     // 서로 다른 운영자 몇 명이 확인하면 검수 완료인지
let sb, me = null, events = [], detail = null, members = [], selected = null, tab = "people", filter = "all", search = "", myOnly = false, view = "event";
let channel = null, logs = [], logsFor = null, logSearch = "";   // logsFor: 지금 들고 있는 기록이 어느 것인지 ('site' 또는 회차 id)

function fail(msg) { $("gate").hidden = false; $("console").hidden = true; $("gateBox").innerHTML = `<h2>잠시만요</h2><p>${esc(msg)}</p>`; }
function discordImg(url, name, size) {
  return url ? `<img src="${esc(url)}" alt="" referrerpolicy="no-referrer" style="width:${size}px;height:${size}px;border-radius:50%" onerror="this.onerror=null;this.src='${letterSvg([...(name || "?")][0] || "?")}'">` : avatar({ name }, size);
}
function fmt(ms) { return ms ? new Date(ms).toLocaleString("ko-KR", { month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit" }) : "미정"; }
function toLocalInput(ms) { if (!ms) return ""; const d = new Date(ms); return new Date(ms - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); }
function fromLocalInput(v) { return v ? new Date(v).toISOString() : null; }
async function call(fn, args = {}) {
  const { data, error } = await sb.rpc(fn, args);
  if (error) { toast("서버에 닿지 못했어요: " + error.message); return null; }
  return data;
}
async function mutate(fn, args) {
  const r = await call(fn, args);
  if (r && r.ok === false) { toast(r.reason); return r; }
  if (r) { ping(); lastSig = ""; if (document.activeElement) document.activeElement.blur(); await refresh(); }
  return r;
}
function ping() { if (channel) channel.send({ type: "broadcast", event: "changed", payload: {} }); }
// 경매 준비를 바꾸면 진행자·팀장 화면에도 바로 알림 (그 회차의 실시간 채널)
let auctionCh = null, auctionChId = null;
function auctionChannel(id) {
  if (auctionChId === id) return auctionCh;
  if (auctionCh) sb.removeChannel(auctionCh);
  auctionChId = id;
  auctionCh = sb.channel(`auction-${id}`, { config: { broadcast: { self: false } } });
  auctionCh.subscribe();
  return auctionCh;
}

/* ---------- 로그인과 권한 ---------- */
async function boot() {
  if (!isConfigured()) return fail("아직 Supabase 연결 정보가 없어요.");
  sb = window.supabase.createClient(AUCTION_CONFIG.supabaseUrl, AUCTION_CONFIG.supabaseKey, {
    auth: { flowType: "implicit", persistSession: true, detectSessionInUrl: true, autoRefreshToken: true },
  });
  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get("error_description")) toast("로그인하지 못했어요: " + hash.get("error_description"));
  await sb.auth.getSession();
  if (location.hash.includes("access_token") || location.hash.includes("error")) history.replaceState(null, "", location.pathname + location.search);
  let last = null;
  sb.auth.onAuthStateChange((ev, s) => { const t = s && s.access_token; if (t !== last) { last = t; setTimeout(route, 0); } });
  route();
}

async function login() {
  const { error } = await sb.auth.signInWithOAuth({ provider: "discord", options: { redirectTo: location.href.split("#")[0] } });
  if (error) toast("로그인을 시작하지 못했어요: " + error.message);
}
async function logout() { await sb.auth.signOut(); location.reload(); }

async function route() {
  me = await call("my_role");
  if (!me) return fail("서버에 연결하지 못했어요. 잠시 뒤 새로고침해 주세요.");
  renderMe();
  const box = $("gateBox");
  const claim = Q.get("claim"), claimKey = Q.get("k"), invite = Q.get("invite");
  if (!me.logged_in) {
    showGate(`<h2>운영자 로그인</h2><p>제작자에게 승인받은 운영자만 들어올 수 있어요.<br>디스코드 계정으로 로그인해 주세요.</p>
      <button class="btn-discord" id="gLogin">디스코드로 로그인</button>`);
    $("gLogin").onclick = login; return;
  }
  if (me.role === "owner" || me.role === "staff") return startConsole();
  if (!me.owner_exists && claim && claimKey) {
    showGate(`<h2>제작자 등록</h2><p><b>${esc(me.name)}</b> 계정을 이 사이트의 제작자(주인)로 등록할까요?<br>제작자는 운영자를 초대·승인하고, 모든 회차의 진행자를 정할 수 있어요. 한 번 등록하면 다른 사람은 제작자가 될 수 없어요.</p>
      <button class="btn primary big" id="gClaim">제작자로 등록</button>`);

/* ---------- 서비스 상태 (무료 요금제는 7일 동안 안 쓰면 멈춤) ---------- */
let svc = null;
async function pingService() {

  renderSvcChip();
  if (view === "staff" && $("svcCard")) $("svcCard").innerHTML = svcCardHtml();
}
function ago(ms) {
  if (!ms) return "기록 없음";
  const m = Math.floor((Date.now() - ms) / 60000);
  return m < 1 ? "방금" : m < 60 ? `${m}분 전` : m < 1440 ? `${Math.floor(m / 60)}시간 전` : `${Math.floor(m / 1440)}일 전`;
}
function renderSvcChip() {
  const el = $("svc"); el.hidden = false;
  el.className = "conn " + (svc && svc.ok ? "on" : "off");
  el.textContent = svc && svc.ok ? `서버 정상 · ${svc.rtt}ms` : "서버 연결 안 됨";
}
function svcCardHtml() {
  if (!svc) return `<div style="color:var(--muted)">확인 중…</div>`;
  if (!svc.ok) return `<div class="big-state" style="color:var(--accent)">서버에 연결되지 않아요</div>
    <div style="color:var(--muted);font-size:13px;line-height:1.6">무료 요금제가 7일 동안 쓰이지 않아 멈췄을 수 있어요. <a href="https://supabase.com/dashboard" target="_blank" style="color:var(--gold)">Supabase 대시보드</a>에서 프로젝트를 열고 <b>Restore project</b>(다시 켜기)를 눌러 주세요. 켜지는 데 몇 분 걸려요.<br>오류: ${esc(svc.error)}</div>`;
  const mb = svc.db_bytes / 1048576, idleDays = svc.last_activity ? (Date.now() - svc.last_activity) / 86400000 : 0;
  return `<div class="big-state" style="color:var(--ok)">서버가 켜져 있어요</div>
    <div class="svc-grid">
      <div><small>응답 속도</small><b>${svc.rtt}ms</b></div>
      <div><small>이 확인 전 마지막 사용</small><b>${ago(svc.last_activity)}</b></div>
      <div><small>데이터베이스 사용량 (무료 500MB)</small><b>${mb.toFixed(1)}MB</b></div>
      <div><small>그중 선수 사진</small><b>${((svc.photo_bytes || 0) / 1048576).toFixed(1)}MB</b></div>
      <div><small>회차 · 신청</small><b>${svc.rounds} · ${svc.signups}</b></div>
      <div><small>자동 깨우기 (3일마다)</small><b>${svc.last_auto_ping ? ago(svc.last_auto_ping) : "아직 없음"}</b></div>
    </div>
    <div style="color:${idleDays > 5 ? "var(--warn)" : "var(--muted)"};font-size:13px;line-height:1.6">
      무료 요금제는 7일 동안 쓰지 않으면 멈춰요. 운영자 콘솔을 열 때마다 ‘사용 중’ 기록을 남겨서 7일을 다시 세요.
      GitHub가 3일마다 서버를 자동으로 깨우고 있어요. 그래도 <b>내전 전날 이 화면을 한 번 열어 확인하면 가장 안전해요.</b>${idleDays > 5 ? ` (이번엔 ${Math.floor(idleDays)}일 만에 열었어요)` : ""}</div>
    ${mb > 350 ? `<div class="warn-note">사용량이 무료 한도(500MB)에 가까워요. 지난 회차의 ‘일정 · 신청 마감’ 탭에서 ‘선수 사진 지우기’로 줄일 수 있어요.</div>` : ""}

}
$("svc").onclick = () => { view = "staff"; lastSig = ""; render(); refresh(); };

/* ---------- 콘솔 ---------- */
async function startConsole() {
  $("gate").hidden = true; $("console").hidden = false;
  $("btnStaff").textContent = me.role === "owner" ? "운영자 관리 · 초대" : "운영자 명단";
  try { selected = localStorage.getItem("valo-console-event"); } catch (e) { /* 무시 */ }
  channel = sb.channel("staff-console", { config: { broadcast: { self: false } } })
    .on("broadcast", { event: "changed" }, () => refresh()).subscribe();
  await refresh();
  setInterval(refresh, 6000);
  pingService();
  setInterval(pingService, 10 * 60 * 1000);   // 콘솔을 켜 둔 동안 10분마다 확인
}

async function refresh() {
  const [ev, mem] = await Promise.all([call("list_events"), call("staff_members")]);
  if (ev === null) return route();            // 권한이 사라졌으면 처음 화면으로
  events = ev; members = mem || []; window.members = members;
  if (!selected || !events.some(e => e.id === selected)) { const first = events.find(e => !isPast(e)) || events[0]; selected = first ? first.id : null; }
  detail = selected ? await call("event_detail", { p_id: selected }) : null;
  if (detail) auctionChannel(detail.event.id);
  // 기록을 못 불러오면 이전 목록을 그대로 둠 (빈 목록으로 덮지 않음)
  if (view === "staff") { const l = await call("get_log", { p_id: null, p_limit: 300 }); if (Array.isArray(l) && view === "staff") { logs = l; logsFor = "site"; } }
  else if (tab === "log" && selected) { const want = selected, l = await call("get_log", { p_id: want, p_limit: 500 }); if (Array.isArray(l) && selected === want) { logs = l; logsFor = want; } }
  const sig = JSON.stringify([events, detail, members, selected, view, tab, logs]);
  if (sig === lastSig) return;
  lastSig = sig;
  // 입력하는 도중에는 다시 그리지 않음 (입력칸을 벗어나면 그림)
  const f = document.activeElement;
  if (f && $("view").contains(f) && /INPUT|SELECT|TEXTAREA/.test(f.tagName) && f.id !== "fSearch" && f.id !== "logSearch") { pendingRender = true; return; }
  render();
}
let lastSig = "", pendingRender = false;
document.addEventListener("focusout", () => setTimeout(() => {
  const f = document.activeElement;
  if (pendingRender && !(f && $("view").contains(f) && /INPUT|SELECT|TEXTAREA/.test(f.tagName))) { pendingRender = false; render(); }
}, 0));

function selectEvent(id) {
  selected = id; view = "event"; lastSig = "";
  try { localStorage.setItem("valo-console-event", id); } catch (e) { /* 무시 */ }
  refresh();
}

function render() {
  // 진행 중·예정 회차와 지난 회차(경매가 끝났거나 경기 일시가 지난 회차)를 나눠 보여 줌
  const active = events.filter(e => !isPast(e));
  const past = events.filter(isPast).sort((a, b) => pastSort(b) - pastSort(a));
  if (past.some(e => e.id === selected)) pastOpen = true;
  const evItem = e => {
    const done = isPast(e);
    return `<li class="${e.id === selected && view === "event" ? "on" : ""} ${done ? "past" : ""}" data-ev="${e.id}">
      <div class="t">${esc(e.title || "이름 없는 회차")}</div>
      <div class="m">${done ? `<span class="chip">${e.status_label === "done" ? "경매 끝" : "경기 지남"}</span><span>경기 ${fmt(e.match_at || e.auction_at)}</span>`
        : `<span class="chip ${e.open ? "open" : "closed"}">${e.open ? "신청 받는 중" : "신청 닫힘"}</span><span>경매 ${fmt(e.auction_at)}</span>`}</div>
      <div class="m"><span>신청 ${e.signups}명</span><span>팀장 ${e.captains}명</span>${e.host_name ? `<span>진행 ${esc(e.host_name)}</span>` : ""}${!done && e.tasks_open ? `<span>할 일 ${e.tasks_open}</span>` : ""}</div>
    </li>`;
  };
  $("evList").innerHTML = (active.length ? active.map(evItem).join("")
      : `<li style="cursor:default;color:var(--muted)">${events.length ? "진행 중이거나 예정된 회차가 없어요." : "아직 회차가 없어요. ‘새 회차 만들기’를 눌러 주세요."}</li>`)
    + (past.length ? `<li class="past-head" data-past-toggle>지난 회차 <b>${past.length}</b><span>${pastOpen ? "접기 ▲" : "펼치기 ▼"}</span></li>${pastOpen ? past.map(evItem).join("") : ""}` : "");
  if (view === "staff") return renderStaff();
  if (!detail) { $("view").innerHTML = `<div class="empty-view">왼쪽에서 회차를 고르거나 새로 만들어 주세요.</div>`; return; }
  renderEvent();
}
$("evList").addEventListener("click", e => {
  if (e.target.closest("[data-past-toggle]")) {
    pastOpen = !pastOpen;
    try { localStorage.setItem("valo-console-past-open", pastOpen ? "1" : "0"); } catch (err) { /* 무시 */ }

});
// 지난 회차: 경매가 끝났거나(done) 경기 일시가 지난 회차
function isPast(e) { return e.status_label === "done" || (!!e.match_at && e.match_at < Date.now()); }
function pastSort(e) { return e.match_at || e.auction_at || e.created_at || 0; }
let pastOpen = false;
try { pastOpen = localStorage.getItem("valo-console-past-open") === "1"; } catch (err) { /* 무시 */ }

function checksOf(s, kind) { return s.checks.filter(c => c.kind === kind); }
function isDone(s, kind) { return checksOf(s, kind).length >= NEED_CHECKS; }

  ({ people: renderPeople, prep: renderPrep, schedule: renderSchedule, tasks: renderTasks, result: renderResult, links: renderLinks, log: renderLog })[tab]();

/* ---------- 참가자: 고치기·지우기·메모·팀장·교차검수 ---------- */

    if (t.id === "btnOrderOk") { const r = await hostAct("set_order", d.order); if (r && r.ok) toast("순서를 확정했어요. 진행자 화면에 첫 선수가 올라갔어요."); }
  };
  body.onchange = ev => {
    const tr = ev.target.closest("[data-sid]");
    if (tr && ev.target.matches("[data-grade]")) { d.grades[Number(tr.dataset.sid)] = ev.target.value; return renderPrep(); }
    if (tr && ev.target.matches("[data-inc]")) { const id = Number(tr.dataset.sid); if (ev.target.checked) d.excluded.delete(id); else d.excluded.add(id); renderPrep(); }
  };
  body.oninput = ev => {
    const t = ev.target, tr = t.closest("[data-sid]");
    if (tr && t.matches("[data-hc]")) d.handicaps[Number(tr.dataset.sid)] = Math.max(0, Math.floor(Number(t.value) || 0));
    if (t.dataset.set) S[t.dataset.set] = Number(t.value);
    if (t.dataset.thc !== undefined) S.handicaps[t.dataset.thc] = Math.max(0, Math.floor(Number(t.value) || 0));
    if (t.dataset.tier) { S.tierScores[t.dataset.tier] = Number(t.value); updateW(); }
    if (t.id === "wRange") { S.peakWeight = Number(t.value) / 100; updateW(); }
  };
  function updateW() {
    $("wLabel").textContent = `${Math.round(S.peakWeight * 100)}% (현재 티어 ${Math.round((1 - S.peakWeight) * 100)}%)`;
    $("wEx").textContent = `예: 최고 불멸 3 / 현재 초월자 2 → ${scoreFormula({ peak: "불멸 3", current: "초월자 2" }, { tierScores: S.tierScores, peakWeight: S.peakWeight })}점`;
  }
  async function saveSettings() {
    const arg = { tierScores: {}, peakWeight: S.peakWeight };
    for (const t of Object.keys(TIER_SCORE)) { const v = Number(S.tierScores[t]); if (!(v >= 0 && v <= 1000)) return toast(`${t} 점수를 0에서 1000 사이로 적어 주세요.`); arg.tierScores[t] = v; }
    if (setup) for (const k of ["startPoints", "bidStep", "teamSize", "reservePerSlot"]) { if (!Number.isInteger(S[k])) return toast("시작 포인트·입찰 단위·팀 인원·빈자리 몫은 정수로 적어 주세요."); arg[k] = S[k]; }
    const r = await hostAct("set_config", arg);
    if (!r || !r.ok) return;
    if (setup) for (const t of detail.state.teams) {
      const want = S.handicaps[t.idx] ?? 0;
      if ((t.handicap || 0) !== want) { const h = await hostAct("set_handicap", { team: t.idx, amount: want }); if (!h || !h.ok) return; }
    }
    d.settings = null; toast("경매 설정을 저장했어요. 팀장 화면에 바로 보여요."); renderPrep();
  }
}

// 진행 기록을 CSV 파일로 내려받기 (엑셀에서 한글이 깨지지 않게 BOM을 붙임)
const CSV_MAX = 1000;     // 서버가 한 번에 주는 최대 개수
async function downloadLogCsv(scope) {
  const btn = $("btnLogCsv"); if (btn) { btn.disabled = true; btn.textContent = "만드는 중…"; }
  const list = await call("get_log", { p_id: scope === "site" ? null : scope, p_limit: CSV_MAX });
  if (btn) { btn.disabled = false; btn.textContent = "CSV로 내려받기"; }
  if (!Array.isArray(list)) return toast("기록을 불러오지 못했어요.");
  if (!list.length) return toast("내려받을 기록이 없어요.");
  const rows = [["시각", "회차", "한 사람", "한 일", "내용"]]
    .concat(list.slice().reverse().map(l => [csvStamp(l.at), l.event || (scope === "site" ? "사이트 전체" : (detail && detail.event.title) || ""), l.who, l.action, l.detail]));
  saveCsv(rows, `auction-log_${scope === "site" ? "all" : "round"}`);
  toast(list.length >= CSV_MAX ? `최근 ${CSV_MAX}개 기록을 내려받았어요.` : `기록 ${list.length}개를 내려받았어요.`);
}

                 "티어 점수(최종)", "자동 점수", "직접 정한 점수", "팀장", "티어 검수", "티어 검수한 사람", "점수 재확인", "점수 재확인한 사람", "메모", "신청 시각"]]
    .concat(detail.signups.map((x, i) => [i + 1, x.nick, x.discord_name, x.discord_username ? "@" + x.discord_username : "", x.peak, x.current, x.pos, agentsOf(x).join(", "), x.grade || "", x.bench ? "대기" : "",
      playerScore(x).toFixed(1), autoScore(x).toFixed(1), x.score != null ? Number(x.score).toFixed(1) : "", x.captain ? "팀장" : "",
      `${checksOf(x, "tier").length}/${NEED_CHECKS}${isDone(x, "tier") ? " 완료" : ""}`, names(x, "tier"),
      `${checksOf(x, "score").length}/${NEED_CHECKS}${isDone(x, "score") ? " 완료" : ""}`, names(x, "score"), x.memo || "", csvStamp(x.at)]));

// CSV 공통: 엑셀 한글 깨짐 방지(BOM), 쉼표·따옴표·줄바꿈이 든 칸은 따옴표로 감쌈
const csvPad = n => String(n).padStart(2, "0");
function csvStamp(ms) { if (!ms) return ""; const d = new Date(ms); return `${d.getFullYear()}-${csvPad(d.getMonth() + 1)}-${csvPad(d.getDate())} ${csvPad(d.getHours())}:${csvPad(d.getMinutes())}:${csvPad(d.getSeconds())}`; }
function saveCsv(rows, prefix) {
  const cell = v => { const t = String(v ?? ""); return /[",\n\r]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const csv = "\uFEFF" + rows.map(r => r.map(cell).join(",")).join("\r\n");
  // 파일 이름은 영문으로 (한글 파일 이름을 "download"로 바꿔 버리는 브라우저가 있음). 내용은 한글 그대로
  const d = new Date();
  const name = `${prefix}_${d.getFullYear()}${csvPad(d.getMonth() + 1)}${csvPad(d.getDate())}-${csvPad(d.getHours())}${csvPad(d.getMinutes())}.csv`;
  const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = name; a.style.display = "none";
  document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 4000);   // 바로 지우면 파일 이름을 못 읽는 브라우저가 있음
}
function bindLogSearch(rerender) {
  $("logSearch").oninput = ev => { logSearch = ev.target.value; const pos = ev.target.selectionStart; rerender(); const f = $("logSearch"); f.focus(); f.setSelectionRange(pos, pos); };
}
function renderLog() {
  $("tabBody").innerHTML = logToolbar() + `<ul class="log-list">${logItems(logs, false, selected)}</ul>`;
  bindLogSearch(renderLog);
  $("btnLogCsv").onclick = () => downloadLogCsv(selected);
}

function renderLinks() {
  const e = detail.event, L = detail.links;
  let html = `<div class="card"><h3>참가 신청 (디스코드 서버에 올리기)</h3>${linkRow("참가 신청 링크", pageLink("signup.html", { s: e.signup_code }), "#5865f2")}</div>`;
  if (L) {
    html += `<div class="card"><h3>경매 당일 (이 회차 진행자·제작자만 보여요)</h3>${linkRow("진행자 화면", pageLink("index.html", { a: e.id, k: L.host_key }), "var(--accent)")}
      ${L.screen_key ? `${linkRow("방송 화면 (OBS)", pageLink("screen.html", { a: e.id, k: L.screen_key }), "var(--gold)")}<div style="color:var(--muted);font-size:12px">방송 화면은 보기만 되는 링크예요. OBS에서 ‘소스 추가 → 브라우저’에 붙여 넣고 너비 1920, 높이 1080으로 두세요.</div>`
        : `<div style="color:var(--warn);font-size:12px">방송 화면 링크를 만들려면 setup.sql을 한 번 더 실행해 주세요.</div>`}
      ${L.team_keys.map((k, i) => linkRow(`${i + 1}번 팀장`, pageLink("team.html", { a: e.id, k }), CONFIG.teamColors[i % CONFIG.teamColors.length])).join("")}
      <div style="color:var(--muted);font-size:12px">팀장 링크의 팀 이름은 경매 화면에서 팀장이 정해지면 바뀌어요.</div></div>`;
  } else html += `<div class="card"><h3>경매 당일</h3><div style="color:var(--muted)">진행자 화면과 팀장 링크는 이 회차의 진행자와 제작자만 볼 수 있어요.</div></div>`;
  $("tabBody").innerHTML = html;
  $("tabBody").onclick = copyBtn;
}
async function copyBtn(ev) {
  if (!ev.target.matches("[data-copy]")) return;
  const input = ev.target.parentElement.querySelector("input");
  try { await navigator.clipboard.writeText(input.value); } catch (err) { input.select(); document.execCommand("copy"); }
  ev.target.textContent = "복사됨"; setTimeout(() => (ev.target.textContent = "복사"), 1500);
}

/* ---------- 운영자 관리 (제작자: 초대·승인·빼기) ---------- */
let staffRenderSeq = 0;
async function renderStaff() {
  const seq = ++staffRenderSeq;
  let invite = "";
  if (me.role === "owner") { const r = await call("get_invite", { p_reset: false }); if (r) invite = pageLink("admin.html", { invite: r.code }); }
  if (seq !== staffRenderSeq || view !== "staff") return;     // 더 새로 그린 화면이 있으면 옛 화면은 버림
  const owner = me.role === "owner";
  const pending = members.filter(m => m.role === "pending"), active = members.filter(m => m.role !== "pending");
  const person = (m, btns) => `<li>${discordImg(m.avatar, m.name, 34)}<div class="grow"><b>${esc(m.name)}</b> ${m.username ? `<span style="color:var(--muted);font-size:12px">@${esc(m.username)}</span>` : ""}</div>${btns}</li>`;
  $("view").innerHTML = `
    <div class="ev-head"><h2>운영자 ${owner ? "관리" : "명단"}</h2></div>
    <div class="card"><h3>서비스 상태 (Supabase 무료 요금제)</h3><div id="svcCard" style="display:grid;gap:10px">${svcCardHtml()}</div></div>
    ${owner ? `<div class="card"><h3>운영자 초대 링크</h3>
      ${linkRow("초대 링크", invite, "var(--ok)")}
      <div style="color:var(--muted);font-size:13px;line-height:1.6">운영자에게 이 링크를 보내면, 디스코드로 로그인해 요청을 보내요. 아래에서 승인해야 들어올 수 있어요.<br>링크가 새어 나갔다면 새 링크로 바꾸세요. 예전 링크는 바로 쓸 수 없게 돼요.</div>
      <div><button class="btn" id="btnInviteReset">새 링크로 바꾸기</button></div></div>
    <div class="card"><h3>승인 기다리는 사람 ${pending.length}명</h3>
      <ul class="people">${pending.length ? pending.map(m => person(m, `<button class="btn primary" data-dec="approve" data-u="${m.user_id}">승인</button><button class="btn" data-dec="reject" data-u="${m.user_id}">거절</button>`)).join("") : `<li style="color:var(--muted)">없어요.</li>`}</ul></div>` : ""}
    <div class="card"><h3>운영자 ${active.length}명</h3>
      <ul class="people">${active.map(m => person(m, m.role === "owner" ? `<span class="role owner">제작자</span>` : owner ? `<span class="role staff">운영자</span><button class="btn" data-dec="remove" data-u="${m.user_id}">빼기</button>` : `<span class="role staff">운영자</span>`)).join("")}</ul></div>
    <div class="card"><h3>전체 진행 기록 (모든 회차 + 운영자 승인 등)</h3>${logToolbar()}<ul class="log-list" id="siteLog">${logItems(logs, true, "site")}</ul></div>`;
  bindLogSearch(() => { $("siteLog").innerHTML = logItems(logs, true, "site"); });
  $("btnLogCsv").onclick = () => downloadLogCsv("site");
  $("view").onclick = async ev => {
    if (ev.target.matches("[data-copy]")) return copyBtn(ev);
    const b = ev.target.closest("[data-dec]");
    if (b) {
      if (b.dataset.dec === "remove" && !confirm("이 사람을 운영자에서 뺄까요?")) return;
      await mutate("staff_decide", { p_user: b.dataset.u, p_action: b.dataset.dec });
      return renderStaff();
    }
    if (ev.target.id === "btnSvcRe") { ev.target.disabled = true; await pingService(); return; }
    if (ev.target.id === "btnInviteReset" && confirm("새 초대 링크로 바꿀까요? 예전 링크는 더 이상 쓸 수 없어요.")) { await call("get_invite", { p_reset: true }); renderStaff(); }
  };
}
$("btnStaff").onclick = () => { view = "staff"; lastSig = ""; render(); refresh(); };

/* ---------- 새 회차 ---------- */
$("btnNewEvent").onclick = () => { $("nTitle").value = ""; $("newModal").classList.add("show"); setTimeout(() => $("nTitle").focus(), 50); };
$("btnNewSave").onclick = async () => {
  const title = $("nTitle").value.trim(); if (!title) return toast("회차 이름을 적어 주세요.");
  const r = await call("create_event", { p_title: title, p_config: CONFIG });
  if (!r || !r.ok) return toast(r ? r.reason : "만들지 못했어요.");
  $("newModal").classList.remove("show");
  ping(); tab = "schedule"; selectEvent(r.id);
};
document.querySelectorAll(".modal").forEach(m => m.addEventListener("click", ev => { if (ev.target === m || ev.target.matches("[data-close]")) m.classList.remove("show"); }));

boot();
</script>
</body>
</html>
