# 사이트 배포: main 에 새 버전이 올라가면 GitHub Pages 에 자동으로 올림
# (Settings → Pages → Source 를 "GitHub Actions" 로 바꿔야 이 파일이 쓰임)
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # Actions 화면에서 "Run workflow" 버튼으로 직접 배포할 수도 있음

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
